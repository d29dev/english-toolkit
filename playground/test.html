<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Custom Editor</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 40px;
        background: #f5f5f7;
        font-family: Arial, sans-serif;
      }

      .editor {
        max-width: 700px;
        margin: auto;
        background: white;
        border: 1px solid #ddd;
        border-radius: 12px;
        overflow: hidden;
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
      }

      .editor:focus-within {
        border-color: #717ec3;
        box-shadow: 0 0 0 3px #717ec322;
      }

      .editor-content {
        min-height: 240px;
        padding: 20px;
        outline: none;
        line-height: 1.7;
        overflow-wrap: anywhere;
        caret-color: #717ec3;
      }

      .editor-content:empty::before {
        content: attr(data-placeholder);
        color: #999;
        pointer-events: none;
      }

      .editor-footer {
        display: flex;
        justify-content: space-between;
        padding: 10px 20px;
        border-top: 1px solid #eee;
        color: #888;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div class="editor">
      <div
        id="editor"
        class="editor-content"
        contenteditable="true"
        spellcheck="false"
        data-placeholder="Nhập nội dung..."
      ></div>

      <div class="editor-footer">
        <span id="status">Sẵn sàng</span>
        <span id="word-count">0 từ</span>
      </div>
    </div>

    <script >

class Editor {
  constructor(selector) {
    this.element = document.querySelector(selector);

    this.status = document.querySelector("#status");
    this.wordCount = document.querySelector("#word-count");

    this.init();
  }

  init() {
    this.element.addEventListener("focus", () => {
      this.status.textContent = "Đang chỉnh sửa";
    });

    this.element.addEventListener("blur", () => {
      this.status.textContent = "Đã lưu trạng thái";
    });

    this.element.addEventListener("input", () => {
      this.updateWordCount();
    });
  }

  updateWordCount() {
    const text = this.getText().trim();

    const words = text
      ? text.split(/\s+/).length
      : 0;

    this.wordCount.textContent = `${words} từ`;
  }

  getText() {
    return this.element.innerText;
  }

  setText(text) {
    this.element.textContent = text;
    this.updateWordCount();
  }

  clear() {
    this.element.replaceChildren();
    this.updateWordCount();
  }

  focus() {
    this.element.focus();
  }
}

const editor = new Editor("#editor");

    </script>
  </body>
</html>
